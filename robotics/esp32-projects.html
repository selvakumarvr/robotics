const slides   = SLIDES;
const tocEl    = document.getElementById("toc");
const tocList  = document.getElementById("toc-list");
const tocToggle= document.getElementById("tocToggle");
const deck     = document.getElementById("deck");
const counter  = document.getElementById("counter");
const progress = document.getElementById("progress");
const prevBtn  = document.getElementById("prevBtn");
const nextBtn  = document.getElementById("nextBtn");
const indicator= document.getElementById("indicator");
let current = 0;

function diffPips(level) {
  let dots = "";
  for (let i = 1; i <= 4; i++) {
    dots += `<span class="pip ${i <= level ? 'on' : ''}"></span>`;
  }
  return `<span class="diff-pips" title="Difficulty ${level}/4">${dots}</span>`;
}

function renderProject(s) {
  const bomRows = s.bom.map(([n,c]) => `<tr><td>${n}</td><td class="c">${c}</td></tr>`).join("");
  const bomTotalRow = s.bomTotal ? `<tr><td>Total BOM</td><td class="c">${s.bomTotal}</td></tr>` : "";
  const skillTags = (s.skills||[]).map(s => `<span class="tag">${s}</span>`).join("");
  const ex = s.realExample
    ? `<div class="example-link">🔗 <a href="${s.realExample.href}" target="_blank" rel="noopener">${s.realExample.label}</a></div>`
    : "";

  const tuts = TUTORIALS[s.num] || [];
  const iconFor = (k) => k === "video" ? "▶" : k === "guide" ? "📄" : "💻";
  const tutHtml = tuts.length ? `
    <div class="section-h">📚 Source videos &amp; tutorials</div>
    <div class="tut-list">
      ${tuts.map(t => `
        <a href="${t.h}" target="_blank" rel="noopener" title="${t.l}">
          <span class="ico ${t.k}">${iconFor(t.k)}</span>
          <span class="lbl">${t.l}</span>
        </a>
      `).join("")}
    </div>
  ` : "";

  return `
    <h1>${s.icon} ${s.title} ${diffPips(s.difficulty)}</h1>
    <div class="proj-hook">${s.hook}</div>
    <div class="proj-card">
      <div>
        <div class="section-h">Key numbers</div>
        <div class="kv-grid">
          <div class="kv cost"><div class="k">BOM cost</div><div class="v">${s.bomTotal}</div></div>
          <div class="kv time"><div class="k">Build time</div><div class="v">${s.time}</div></div>
          <div class="kv price"><div class="k">Sell price</div><div class="v">${s.sell}</div></div>
          <div class="kv margin"><div class="k">Margin</div><div class="v">${s.margin}</div></div>
        </div>
        <div class="where">${s.where}</div>
        <div class="demo-card">${s.demo}</div>
        ${ex}
        ${tutHtml}
      </div>
      <div>
        <div class="section-h">Bill of materials</div>
        <table class="bom-table">
          <tr><th>Part</th><th style="text-align:right;">Cost</th></tr>
          ${bomRows}
          ${bomTotalRow}
        </table>
        <div class="section-h">Skills you'll practice</div>
        <div class="tag-row">${skillTags}</div>
        <div class="callout">${s.why}</div>
      </div>
    </div>
  `;
}

function renderTierIntro(s) {
  const bullets = (s.bullets || []).map(b => `<li>${b}</li>`).join("");
  return `
    <h1>${s.icon} ${s.tierName}</h1>
    <p class="sub">${s.sub}</p>
    <div class="tier-intro">
      <div class="tier-stats">
        <h2>Tier at a glance</h2>
        <div class="row">
          <div><div class="num">${s.statCount}</div><div class="lbl">Projects</div></div>
          <div><div class="num">${s.statBom}</div><div class="lbl">BOM range</div></div>
          <div><div class="num">${s.statTime}</div><div class="lbl">Build time</div></div>
          <div><div class="num">${s.statSell}</div><div class="lbl">Sell price</div></div>
        </div>
      </div>
      <div>
        <div class="section-h">Strategy for this tier</div>
        <ul class="tier-list">${bullets}</ul>
      </div>
    </div>`;
}

function renderCustomCards(s) {
  const cards = (s.customCards || []).map(c =>
    `<div class="strat-card"><h3>${c.h}</h3><p>${c.t}</p></div>`
  ).join("");
  const subHtml = s.sub ? `<p class="sub">${s.sub}</p>` : "";
  return `<h1>${s.title}</h1>${subHtml}<div class="strat-grid">${cards}</div>`;
}

function renderCover(s) {
  const pills = (s.metaPills || []).map(p => `<span class="pill">${p}</span>`).join("");
  const cta   = (s.cta || []).map(c =>
    c.action === "next"
      ? `<a class="cta" href="#" data-next>${c.label}</a>`
      : `<a class="cta ${c.ghost ? "ghost":""}" href="${c.href}" target="_blank">${c.label}</a>`
  ).join("");
  return `
    <h1>${s.title}</h1>
    <p class="sub">${s.sub || ""}</p>
    <div class="meta">${pills}</div>
    <div class="cta-row">${cta}</div>
  `;
}

function renderStandard(s) {
  const bullets = (s.bullets || []).map(b => `<li>${b}</li>`).join("");
  const subHtml = s.sub ? `<p class="sub">${s.sub}</p>` : "";
  const customHtml = s.customHtml || "";
  const noteHtml = s.note ? `<div class="callout" style="margin-top:14px;">${s.note}</div>` : "";

  const channelsHtml = (s.channels || []).length
    ? `<div class="channels-grid">${s.channels.map(c => `
        <div class="ch-card">
          <div class="ch-kind">${c.kind}</div>
          <div class="ch-name">${c.name}</div>
          <div class="ch-desc">${c.desc}</div>
          <a href="${c.url}" target="_blank" rel="noopener">Open ↗</a>
        </div>`).join("")}</div>`
    : "";

  const cta = (s.cta || []).map(c =>
    `<a class="cta ${c.ghost ? 'ghost' : ''}" href="${c.href}" ${c.href && c.href.startsWith('http') ? 'target="_blank"' : ''}>${c.label}</a>`
  ).join("");
  const ctaHtml = cta ? `<div class="cta-row" style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">${cta}</div>` : "";
  return `
    <h1>${s.title}</h1>
    ${subHtml}
    ${bullets ? `<ul style="font-size:14.5px; line-height:1.6; color:#1f2937;">${bullets}</ul>` : ""}
    ${channelsHtml}
    ${customHtml}
    ${noteHtml}
    ${ctaHtml}
  `;
}

function renderSlide(s, i) {
  const meta = SECTIONS[s.section] || SECTIONS.cover;
  const el = document.createElement("section");
  el.className = `slide ${meta.cls}`;
  el.dataset.i = i;
  el.style.display = i === 0 ? "flex" : "none";

  const header = `
    <div class="slide-header">
      <span class="pill">${meta.title}</span>
      <span>slide ${i+1} / ${slides.length}</span>
    </div>`;

  let body = "";
  if (s.cover) {
    el.classList.add("cover");
    body = renderCover(s);
  } else if (s.tierIntro) {
    body = renderTierIntro(s);
  } else if (s.project) {
    body = renderProject(s);
  } else if (s.customCards) {
    body = renderCustomCards(s);
  } else {
    body = renderStandard(s);
  }

  const footer = `
    <div class="slide-footer">
      <span class="crumbs">🛒 ESP32 Build &amp; Sell · 32 curated projects · 2026 edition</span>
      <span>${meta.title} · ${i+1}/${slides.length}</span>
    </div>`;

  el.innerHTML = `${header}${body}${footer}`;
  return el;
}

function renderTOC() {
  let html = "";
  let lastSec = null;
  slides.forEach((s, i) => {
    if (s.section !== lastSec) {
      const meta = SECTIONS[s.section] || SECTIONS.cover;
      if (lastSec !== null) html += `</div>`;
      html += `<div class="toc-section">
        <div class="toc-section-title"><span class="dot ${meta.dot}"></span>${meta.title}</div>`;
      lastSec = s.section;
    }
    const title = (s.title || s.tierName || "").replace(/<[^>]+>/g, "");
    html += `<div class="toc-item" data-i="${i}"><span class="num">${i+1}</span><span>${title}</span></div>`;
  });
  if (lastSec !== null) html += `</div>`;
  tocList.innerHTML = html;
}

function go(i) {
  current = Math.max(0, Math.min(slides.length - 1, i));
  const slides_els = deck.querySelectorAll(".slide");
  slides_els.forEach(el => el.style.display = "none");
  if (slides_els[current]) slides_els[current].style.display = "flex";
  counter.textContent = `${current+1} / ${slides.length}`;
  indicator.textContent = `${current+1} / ${slides.length}`;
  progress.style.width = `${((current+1)/slides.length)*100}%`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;
  document.querySelectorAll(".toc-item").forEach(el => {
    el.classList.toggle("active", Number(el.dataset.i) === current);
  });
  const activeToc = document.querySelector(".toc-item.active");
  if (activeToc) activeToc.scrollIntoView({ block: "nearest", behavior: "smooth" });
  window.scrollTo({ top: 0, behavior: "smooth" });
  history.replaceState(null, "", `#${current+1}`);
}

function init() {
  slides.forEach((s, i) => deck.appendChild(renderSlide(s, i)));
  renderTOC();
  const startHash = parseInt((location.hash || "").replace("#",""), 10);
  go(Number.isInteger(startHash) && startHash > 0 ? startHash - 1 : 0);
  prevBtn.addEventListener("click", () => go(current - 1));
  nextBtn.addEventListener("click", () => go(current + 1));
  tocToggle.addEventListener("click", () => tocEl.classList.toggle("open"));
  tocList.addEventListener("click", (e) => {
    const item = e.target.closest(".toc-item");
    if (!item) return;
    go(Number(item.dataset.i));
    tocEl.classList.remove("open");
  });
  deck.addEventListener("click", (e) => {
    if (e.target.matches("[data-next]")) { e.preventDefault(); go(current + 1); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(current + 1); }
    if (e.key === "ArrowLeft"  || e.key === "PageUp")   { e.preventDefault(); go(current - 1); }
    if (e.key === "Home") { e.preventDefault(); go(0); }
    if (e.key === "End")  { e.preventDefault(); go(slides.length - 1); }
  });
  let touchStartX = null;
  deck.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; });
  deck.addEventListener("touchend", (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (dx >  60) go(current - 1);
    if (dx < -60) go(current + 1);
    touchStartX = null;
  });
}
init();
</script>
