<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arduino Adventures · A Beginner's Presentation for Young Makers</title>
<meta name="description" content="A simple, fun, complete walk-through of the Arduino Course for Beginners by Ashish Bansal (FreeCodeCamp). Built for curious kids aged 10–15." />
<style>
  /* =========================================================
     ARDUINO ADVENTURES — single-file kid-friendly presentation
     Covers every topic from: https://youtu.be/zJ-LqeX_fLU
     ========================================================= */

  :root {
    --bg-1:#0f172a;
    --bg-2:#1e293b;
    --ink:#0b1220;
    --paper:#ffffff;
    --muted:#475569;
    --soft:#e2e8f0;
    --shadow: 0 20px 60px rgba(2,6,23,.18), 0 4px 12px rgba(2,6,23,.08);
    --radius: 22px;
    --radius-sm: 12px;

    /* Section accent gradients */
    --c-cover-1:#7c3aed;  --c-cover-2:#ec4899;
    --c-elec-1:#f59e0b;   --c-elec-2:#ef4444;
    --c-board-1:#0ea5a3;  --c-board-2:#06b6d4;     /* Arduino teal */
    --c-ide-1:#2563eb;    --c-ide-2:#3b82f6;
    --c-prep-1:#16a34a;   --c-prep-2:#22c55e;
    --c-prog-1:#db2777;   --c-prog-2:#f43f5e;
    --c-var-1:#4f46e5;    --c-var-2:#6366f1;
    --c-scope-1:#7e22ce;  --c-scope-2:#9333ea;
    --c-op-1:#9333ea;     --c-op-2:#c026d3;
    --c-ctrl-1:#be185d;   --c-ctrl-2:#db2777;
    --c-arr-1:#0891b2;    --c-arr-2:#22d3ee;
    --c-fn-1:#65a30d;     --c-fn-2:#84cc16;
    --c-bi-1:#d97706;     --c-bi-2:#f59e0b;
    --c-lib-1:#ea580c;    --c-lib-2:#f97316;
    --c-end-1:#7c3aed;    --c-end-2:#06b6d4;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { background: var(--bg-1); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", "Nunito", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 800px at 10% -10%, #1e293b, transparent 60%),
      radial-gradient(1200px 800px at 110% 110%, #0b1220, transparent 60%),
      linear-gradient(180deg, #0f172a, #020617);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* App layout */
  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .toc { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .25s ease; z-index: 50; width: 280px; }
    .toc.open { transform: translateX(0); box-shadow: 0 12px 40px rgba(0,0,0,.4); }
    .toc-toggle { display: inline-flex !important; }
  }

  /* TOC */
  .toc {
    background: linear-gradient(180deg, #0b1220 0%, #111827 100%);
    color: #e2e8f0;
    padding: 18px 14px;
    border-right: 1px solid rgba(255,255,255,.06);
    overflow-y: auto;
    max-height: 100vh;
    position: sticky; top: 0;
  }
  .toc h2 {
    font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase;
    color: #94a3b8; margin: 6px 8px 14px; font-weight: 700;
  }
  .toc .brand {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, #06b6d4, #7c3aed);
    color: white; padding: 12px 14px; border-radius: 14px; margin-bottom: 14px;
    font-weight: 800;
  }
  .toc .brand-emoji { font-size: 22px; }
  .toc .brand small { display: block; font-weight: 400; opacity: .85; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; }

  .toc-section { margin-bottom: 14px; }
  .toc-section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    color: #cbd5e1; padding: 6px 10px;
    background: rgba(255,255,255,.04); border-radius: 8px; margin-bottom: 6px;
    font-weight: 700;
  }
  .toc-section .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .toc-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: #cbd5e1; line-height: 1.25;
    transition: background .15s ease, color .15s ease;
    user-select: none;
  }
  .toc-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .toc-item.active {
    background: linear-gradient(90deg, rgba(99,102,241,.25), rgba(236,72,153,.18));
    color: #fff; font-weight: 600;
  }
  .toc-item .num {
    font-variant-numeric: tabular-nums;
    color: #94a3b8; font-size: 11px; min-width: 22px;
  }
  .toc-item.active .num { color: #f8fafc; }

  /* Main */
  main.deck-wrap {
    padding: 22px 28px 90px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; color: #cbd5e1; gap: 10px;
  }
  .toc-toggle {
    display: none; align-items: center; gap: 6px;
    background: #1f2937; color: #f8fafc; border: 1px solid #374151;
    border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer;
  }
  .topbar .progress-wrap {
    flex: 1; height: 8px; background: rgba(255,255,255,.08);
    border-radius: 999px; overflow: hidden;
  }
  .topbar .progress {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #06b6d4, #7c3aed, #ec4899);
    transition: width .25s ease;
  }
  .topbar .counter { font-variant-numeric: tabular-nums; font-size: 13px; }

  /* Slide */
  .slide {
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 36px 40px 30px;
    min-height: calc(100vh - 160px);
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
    animation: pop .35s ease both;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px) scale(.992); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .slide::before {
    content: "";
    position: absolute; inset: 0 0 auto 0; height: 8px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
  }
  .slide::after {
    content: "";
    position: absolute; top: -160px; right: -160px;
    width: 360px; height: 360px; border-radius: 50%;
    background: radial-gradient(closest-side, var(--accent-2), transparent 70%);
    opacity: .14; filter: blur(2px); pointer-events: none;
  }

  .slide-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    color: white; padding: 6px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 700; letter-spacing: .5px;
  }
  .section-tag {
    color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .4px;
    text-transform: uppercase;
  }
  .watch-link {
    color: var(--accent-1);
    text-decoration: none; font-weight: 700; font-size: 13px;
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--accent-1); padding: 6px 10px; border-radius: 999px;
    transition: background .15s ease, color .15s ease;
  }
  .watch-link:hover { background: var(--accent-1); color: white; }

  .slide h1 {
    margin: 8px 0 18px;
    font-size: clamp(28px, 3.4vw, 42px);
    line-height: 1.1;
    color: var(--ink);
    font-weight: 800;
    letter-spacing: -.5px;
  }
  .slide h1 .emoji { margin-right: 10px; }

  .slide-body {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 28px;
    align-items: start;
    flex: 1;
  }
  @media (max-width: 820px) {
    .slide-body { grid-template-columns: 1fr; gap: 18px; }
    .slide { padding: 24px 22px; }
    .slide h1 { font-size: 26px; }
  }

  .visual {
    background: linear-gradient(135deg, rgba(0,0,0,.03), rgba(0,0,0,.01));
    border: 1px solid rgba(0,0,0,.05);
    border-radius: var(--radius-sm);
    padding: 18px;
    display: flex; align-items: center; justify-content: center;
    min-height: 260px;
    position: relative;
  }
  .visual .mega-emoji {
    font-size: clamp(80px, 12vw, 140px);
    line-height: 1; text-align: center;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,.08));
  }
  .visual svg { max-width: 100%; height: auto; }

  .content ul { list-style: none; padding: 0; margin: 0 0 14px; }
  .content li {
    padding: 10px 12px 10px 38px;
    position: relative;
    background: rgba(0,0,0,.025);
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 16px;
    line-height: 1.45;
  }
  .content li::before {
    content: "";
    position: absolute; left: 12px; top: 14px;
    width: 16px; height: 16px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(0,0,0,.04);
  }
  .content li strong { color: var(--ink); }

  .analogy {
    background: linear-gradient(135deg, rgba(255,255,255,.7), rgba(255,255,255,.4));
    border: 1px dashed var(--accent-1);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
  }
  .analogy::before {
    content: "💡 Real-world: ";
    font-weight: 800;
    color: var(--accent-1);
    letter-spacing: .3px;
    margin-right: 4px;
  }
  .analogy.try::before { content: "🎯 Try this: "; }
  .analogy.note::before { content: "📝 Remember: "; }
  .analogy.warn::before { content: "⚠️ Careful: "; }
  .analogy.fun::before { content: "🤓 Fun fact: "; }

  .code {
    background: #0f172a; color: #e2e8f0;
    border-radius: 10px; padding: 12px 14px;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.55;
    overflow-x: auto;
    margin: 8px 0 12px;
  }
  .code .kw   { color: #c084fc; font-weight: 700; }
  .code .fn   { color: #fbbf24; }
  .code .str  { color: #4ade80; }
  .code .num  { color: #f472b6; }
  .code .com  { color: #94a3b8; font-style: italic; }
  .code .pin  { color: #38bdf8; }

  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .pill {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: white; padding: 5px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 700;
  }
  .pill.ghost { background: rgba(0,0,0,.05); color: var(--muted); }

  .slide-footer {
    margin-top: auto;
    padding-top: 16px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--muted);
    border-top: 1px dashed rgba(0,0,0,.08);
  }
  .slide-footer .crumbs { display: flex; align-items: center; gap: 6px; }

  /* Nav buttons */
  .controls {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 30;
    background: rgba(15,23,42,.85); backdrop-filter: blur(8px);
    padding: 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,.08);
  }
  .controls button {
    background: rgba(255,255,255,.08); color: #f1f5f9;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px; padding: 8px 14px;
    font-weight: 700; cursor: pointer;
    font-size: 13px;
    transition: background .15s ease, transform .1s ease;
  }
  .controls button:hover { background: rgba(255,255,255,.18); }
  .controls button:disabled { opacity: .35; cursor: not-allowed; }
  .controls .indicator { color: #cbd5e1; font-size: 13px; padding: 8px 12px; font-variant-numeric: tabular-nums; }

  /* Cover slide special */
  .slide.cover {
    text-align: center;
    background:
      radial-gradient(800px 500px at 20% 0%, rgba(124,58,237,.18), transparent 60%),
      radial-gradient(800px 500px at 100% 100%, rgba(6,182,212,.18), transparent 60%),
      linear-gradient(135deg, #fafaff, #f0f9ff);
  }
  .slide.cover .slide-body {
    grid-template-columns: 1fr;
    text-align: center;
    align-items: center;
    justify-items: center;
  }
  .slide.cover h1 {
    font-size: clamp(40px, 6vw, 68px);
    background: linear-gradient(90deg, #7c3aed, #06b6d4, #ec4899);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-top: 10px;
  }
  .slide.cover .sub {
    color: var(--muted);
    font-size: clamp(15px, 1.8vw, 19px);
    max-width: 720px;
    line-height: 1.5;
    margin: 0 auto 18px;
  }
  .slide.cover .meta {
    display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    margin: 6px 0 18px;
  }
  .slide.cover .yt-thumb {
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(2,6,23,.25);
    max-width: 520px; width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
  }
  .slide.cover .yt-fallback {
    width: 100%; max-width: 520px; aspect-ratio: 16/9;
    border-radius: 14px;
    background: linear-gradient(135deg, #06b6d4, #7c3aed);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800;
    box-shadow: 0 18px 50px rgba(2,6,23,.25);
    margin: 12px auto;
  }
  .cta-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .cta {
    background: linear-gradient(135deg, #06b6d4, #7c3aed);
    color: white; padding: 12px 22px; border-radius: 999px;
    font-weight: 700; text-decoration: none;
    box-shadow: 0 10px 25px rgba(124,58,237,.35);
  }
  .cta.ghost { background: rgba(0,0,0,.05); color: var(--ink); box-shadow: none; }

  /* Section end / divider slide style (used on final) */
  .slide.end .slide-body { grid-template-columns: 1fr; text-align: center; align-items: center; justify-items: center; }
  .slide.end h1 { font-size: clamp(36px, 5vw, 56px); }

  /* Print */
  @media print {
    body { background: white; }
    .app { grid-template-columns: 1fr; }
    .toc, .controls, .topbar, .toc-toggle { display: none !important; }
    main.deck-wrap { padding: 0; max-width: none; }
    .slide {
      page-break-after: always;
      box-shadow: none;
      border-radius: 0;
      min-height: 100vh;
      animation: none;
    }
    .slide::before { height: 6px; }
    .slide::after { display: none; }
  }

  /* Accent helpers (applied via inline style or section class) */
  .slide.s-cover { --accent-1: var(--c-cover-1); --accent-2: var(--c-cover-2); }
  .slide.s-electronics { --accent-1: var(--c-elec-1); --accent-2: var(--c-elec-2); }
  .slide.s-board { --accent-1: var(--c-board-1); --accent-2: var(--c-board-2); }
  .slide.s-ide { --accent-1: var(--c-ide-1); --accent-2: var(--c-ide-2); }
  .slide.s-prep { --accent-1: var(--c-prep-1); --accent-2: var(--c-prep-2); }
  .slide.s-prog { --accent-1: var(--c-prog-1); --accent-2: var(--c-prog-2); }
  .slide.s-var  { --accent-1: var(--c-var-1);  --accent-2: var(--c-var-2); }
  .slide.s-scope{ --accent-1: var(--c-scope-1);--accent-2: var(--c-scope-2); }
  .slide.s-op   { --accent-1: var(--c-op-1);   --accent-2: var(--c-op-2); }
  .slide.s-ctrl { --accent-1: var(--c-ctrl-1); --accent-2: var(--c-ctrl-2); }
  .slide.s-arr  { --accent-1: var(--c-arr-1);  --accent-2: var(--c-arr-2); }
  .slide.s-fn   { --accent-1: var(--c-fn-1);   --accent-2: var(--c-fn-2); }
  .slide.s-bi   { --accent-1: var(--c-bi-1);   --accent-2: var(--c-bi-2); }
  .slide.s-lib  { --accent-1: var(--c-lib-1);  --accent-2: var(--c-lib-2); }
  .slide.s-end  { --accent-1: var(--c-end-1);  --accent-2: var(--c-end-2); }

  /* small color swatches in TOC */
  .dot-cover{background: linear-gradient(135deg,var(--c-cover-1),var(--c-cover-2));}
  .dot-electronics{background: linear-gradient(135deg,var(--c-elec-1),var(--c-elec-2));}
  .dot-board{background: linear-gradient(135deg,var(--c-board-1),var(--c-board-2));}
  .dot-ide{background: linear-gradient(135deg,var(--c-ide-1),var(--c-ide-2));}
  .dot-prep{background: linear-gradient(135deg,var(--c-prep-1),var(--c-prep-2));}
  .dot-prog{background: linear-gradient(135deg,var(--c-prog-1),var(--c-prog-2));}
  .dot-var{background: linear-gradient(135deg,var(--c-var-1),var(--c-var-2));}
  .dot-scope{background: linear-gradient(135deg,var(--c-scope-1),var(--c-scope-2));}
  .dot-op{background: linear-gradient(135deg,var(--c-op-1),var(--c-op-2));}
  .dot-ctrl{background: linear-gradient(135deg,var(--c-ctrl-1),var(--c-ctrl-2));}
  .dot-arr{background: linear-gradient(135deg,var(--c-arr-1),var(--c-arr-2));}
  .dot-fn{background: linear-gradient(135deg,var(--c-fn-1),var(--c-fn-2));}
  .dot-bi{background: linear-gradient(135deg,var(--c-bi-1),var(--c-bi-2));}
  .dot-lib{background: linear-gradient(135deg,var(--c-lib-1),var(--c-lib-2));}
  .dot-end{background: linear-gradient(135deg,var(--c-end-1),var(--c-end-2));}

  /* SVG helpers */
  .label { font: 600 12px -apple-system, "Inter", sans-serif; fill: #0f172a; }
  .muted-text { fill: #64748b; font: 500 11px -apple-system, "Inter", sans-serif; }
  .wire { stroke: #0f172a; stroke-width: 2; fill: none; }
  .led-glow { filter: url(#led-blur); }


  /* ===== Quiz styles ===== */
  .quiz-card{
    background: linear-gradient(135deg,#fef9c3,#fde68a);
    border: 2px solid var(--accent-1);
    border-radius: var(--radius-sm);
    padding: 18px;
    margin: 0 0 14px;
  }
  .quiz-q{ font-size: 18px; font-weight: 800; color: var(--ink); margin: 0 0 14px; }
  .quiz-options{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 700px){ .quiz-options{ grid-template-columns: 1fr; } }
  .quiz-option{
    background: white; border: 2px solid #cbd5e1; border-radius: 12px;
    padding: 12px 14px; cursor: pointer; font-size: 14px; font-weight: 600;
    text-align: left; transition: all .15s ease; position: relative; line-height: 1.35;
    color: var(--ink); font-family: inherit;
  }
  .quiz-option:hover{ transform: translateY(-1px); border-color: var(--accent-1); }
  .quiz-option.correct{ background:#dcfce7; border-color:#16a34a; }
  .quiz-option.wrong  { background:#fee2e2; border-color:#dc2626; }
  .quiz-option.disabled{ cursor: not-allowed; pointer-events: none; }
  .quiz-option .badge{ position: absolute; top: 8px; right: 8px; font-size: 18px; }
  .quiz-explain{
    margin-top: 14px; padding: 12px 14px;
    background: rgba(255,255,255,.85); border-radius: 10px;
    font-size: 14px; display: none; line-height: 1.5;
  }
  .quiz-explain.show{ display: block; }
  .quiz-explain.correct{ border-left: 4px solid #16a34a; }
  .quiz-explain.wrong  { border-left: 4px solid #dc2626; }
  .quiz-reset{
    background: rgba(0,0,0,.05); color: var(--muted); border: 0; padding: 6px 10px;
    border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 10px;
  }

  /* ===== Project build cards ===== */
  .build-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 820px){ .build-grid{ grid-template-columns: 1fr; } }
  .build-card{
    background: rgba(255,255,255,.65);
    border: 1px solid rgba(0,0,0,.08);
    border-radius: 12px; padding: 14px;
  }
  .build-card h4{
    margin: 0 0 10px; font-size: 12px; letter-spacing: .8px;
    text-transform: uppercase; color: var(--accent-1); font-weight: 800;
  }
  .build-card ul{ list-style: none; padding: 0; margin: 0; }
  .build-card.parts li{
    padding: 6px 0 6px 26px; background: none !important; margin: 0;
    font-size: 14px; position: relative; border-radius: 0; line-height: 1.4;
  }
  .build-card.parts li::before{
    content: "🧩"; position: absolute; left: 0; top: 6px;
    background: none !important; width: auto; height: auto; border-radius: 0; box-shadow: none;
  }
  .build-card.steps ol{ counter-reset: step; list-style: none; padding: 0; margin: 0; }
  .build-card.steps li{
    padding: 8px 0 8px 32px; position: relative; font-size: 14px; line-height: 1.45;

function renderQuizBody(s) {
  const opts = s.options.map((o, idx) => `
    <button class="quiz-option" data-correct="${o.correct ? "1":"0"}" data-i="${idx}" type="button">
      ${o.text}
      <span class="badge" data-icon></span>
    </button>`).join("");
  return `
    <h1>${s.title}</h1>
    <div class="slide-body" style="grid-template-columns: 1fr;">
      <div>
        <div class="quiz-card">
          <p class="quiz-q">${s.question}</p>
          <div class="quiz-options" data-options>${opts}</div>
          <div class="quiz-explain" data-explain></div>
          <button class="quiz-reset" type="button" data-reset style="display:none;">↻ Try again</button>
        </div>
        ${s.analogy ? `<div class="analogy ${s.analogyClass||""}">${s.analogy}</div>` : ""}
      </div>
    </div>`;
}

function renderProjectBody(s) {
  const parts = (s.parts || []).map(p => `<li>${p}</li>`).join("");
  const steps = (s.steps || []).map(st => `<li>${st}</li>`).join("");
  const diffCls = (s.difficulty || "easy").toLowerCase();
  return `
    <h1>${s.title} <span class="build-difficulty ${diffCls}">${(s.difficulty||"Easy")}</span></h1>
    <div class="slide-body" style="grid-template-columns: 1fr;">
      <div>
        <div class="build-grid">
          <div class="build-card parts">
            <h4>What you need</h4>
            <ul>${parts}</ul>
          </div>
          <div class="build-card steps">
            <h4>How to build it</h4>
            <ol>${steps}</ol>
          </div>
        </div>
        ${s.wiring ? `<div class="build-card" style="margin-top:14px;"><h4>Wiring</h4>${s.wiring}</div>` : ""}
        ${s.code ? `<pre class="code">${s.code}</pre>` : ""}
        ${s.challenge ? `<div class="build-challenge">${s.challenge}</div>` : ""}
      </div>
    </div>`;
}

function renderSlide(s, i) {
  const meta = SECTIONS[s.section] || SECTIONS.cover;
  const el = document.createElement("section");
  el.className = `slide ${meta.cls}`;
  el.id = `slide-${i+1}`;

  if (s.quiz)    el.classList.add("quiz-slide");
  if (s.project) el.classList.add("project-slide");
  if (s.cover) el.classList.add("cover");
  if (s.section === "end" && s.cover) el.classList.add("end");

  /* Header */
  const header = `
    <div class="slide-header">
      <span class="chip">Slide ${i+1} of ${slides.length}</span>
      <span class="section-tag">${meta.title}</span>
      ${typeof s.t === "number" ? `<a class="watch-link" target="_blank" href="${YT(s.t)}">▶ Watch on YouTube</a>` : ""}
    </div>`;

  /* Body */
  let body = "";

  if (s.cover) {
    const pills = (s.metaPills || []).map(p => `<span class="pill">${p}</span>`).join("");
    const cta   = (s.cta || []).map(c =>
      c.action === "next"
        ? `<a class="cta" href="#" data-next>${c.label}</a>`
        : `<a class="cta ${c.ghost ? "ghost":""}" href="${c.href}" target="_blank">${c.label}</a>`
    ).join("");

    const thumbHtml = s.youtubeThumb
      ? `<img class="yt-thumb" alt="Video thumbnail"
              src="https://i.ytimg.com/vi/${VIDEO_ID}/maxresdefault.jpg"
              onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${VIDEO_ID}/hqdefault.jpg';this.onerror=function(){this.style.display='none';var f=document.createElement('div');f.className='yt-fallback';f.textContent='▶ Arduino Course for Beginners';this.parentNode.insertBefore(f,this);}" />`
      : "";

    body = `
      <div class="slide-body">
        <div>
          <h1>${s.title}</h1>
          <p class="sub">${s.sub || ""}</p>
          ${thumbHtml ? `<div>${thumbHtml}</div>` : ""}
          <div class="meta">${pills}</div>
          <div class="cta-row">${cta}</div>
        </div>
      </div>`;
  } else {
    const visual = s.svg
      ? `<div class="visual">${s.svg}</div>`
      : s.visualEmoji
        ? `<div class="visual"><div class="mega-emoji">${s.visualEmoji}</div></div>`
        : `<div class="visual"><div class="mega-emoji">📘</div></div>`;

    const codeHtml = s.code ? `<pre class="code">${s.code}</pre>` : "";
    const analogyHtml = s.analogy
      ? `<div class="analogy ${s.analogyClass || ""}">${s.analogy}</div>`
      : "";
    const bullets = (s.bullets || []).map(b => `<li>${b}</li>`).join("");

    body = `
      <h1>${s.title}</h1>
      <div class="slide-body">
        ${visual}
        <div class="content">
          <ul>${bullets}</ul>
          ${codeHtml}
          ${analogyHtml}
        </div>
      </div>`;
  }

  /* Footer */
  const footer = `
    <div class="slide-footer">
      <span class="crumbs">📺 Based on the FreeCodeCamp video by Ashish Bansal</span>
      <span>${meta.title} · ${i+1}/${slides.length}</span>
    </div>`;

  el.innerHTML = `${header}${body}${footer}`;
  return el;
}

function renderTOC() {
  /* group slides by section in document order */
  let html = "";
  let lastSec = null;
  slides.forEach((s, i) => {
    if (s.section !== lastSec) {
      const meta = SECTIONS[s.section] || SECTIONS.cover;
      if (lastSec !== null) html += `</div>`;
      html += `<div class="toc-section">
        <div class="toc-section-title"><span class="dot ${meta.dot}"></span>${meta.title}</div>`;
      lastSec = s.section;
    }
    const title = s.title.replace(/<[^>]+>/g, "");
    html += `<div class="toc-item" data-i="${i}"><span class="num">${i+1}</span><span>${title}</span></div>`;
  });
  if (lastSec !== null) html += `</div>`;
  tocList.innerHTML = html;
}

function go(i) {
  current = Math.max(0, Math.min(slides.length - 1, i));
  const slides_els = deck.querySelectorAll(".slide");
  slides_els.forEach(el => el.style.display = "none");
  if (slides_els[current]) slides_els[current].style.display = "flex";

  counter.textContent = `${current+1} / ${slides.length}`;
  indicator.textContent = `${current+1} / ${slides.length}`;
  progress.style.width = `${((current+1)/slides.length)*100}%`;

  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;

  document.querySelectorAll(".toc-item").forEach(el => {
    el.classList.toggle("active", Number(el.dataset.i) === current);
  });
  /* Scroll active TOC item into view */
  const activeToc = document.querySelector(".toc-item.active");
  if (activeToc) activeToc.scrollIntoView({ block: "nearest", behavior: "smooth" });
  /* Scroll page top */
  window.scrollTo({ top: 0, behavior: "smooth" });

  /* Update URL hash for sharing/back */
  history.replaceState(null, "", `#${current+1}`);
}

function init() {
  /* Render every slide once */
  slides.forEach((s, i) => deck.appendChild(renderSlide(s, i)));
  renderTOC();

  /* Initial slide */
  const startHash = parseInt((location.hash || "").replace("#",""), 10);
  go(Number.isInteger(startHash) && startHash > 0 ? startHash - 1 : 0);

  /* Nav */
  prevBtn.addEventListener("click", () => go(current - 1));
  nextBtn.addEventListener("click", () => go(current + 1));
  tocToggle.addEventListener("click", () => tocEl.classList.toggle("open"));
  tocList.addEventListener("click", (e) => {
    const item = e.target.closest(".toc-item");
    if (!item) return;
    go(Number(item.dataset.i));
    tocEl.classList.remove("open");
  });
  /* Cover slide "Start" button */
  deck.addEventListener("click", (e) => {
    if (e.target.matches("[data-next]")) {
      e.preventDefault();
      go(current + 1);
    }
  });
  /* Keyboard */
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(current + 1); }
    if (e.key === "ArrowLeft"  || e.key === "PageUp")   { e.preventDefault(); go(current - 1); }
    if (e.key === "Home") { e.preventDefault(); go(0); }
    if (e.key === "End")  { e.preventDefault(); go(slides.length - 1); }
  });
  /* Swipe on touch devices */
  let touchStartX = null;
  deck.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; });
  deck.addEventListener("touchend", (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (dx >  60) go(current - 1);
    if (dx < -60) go(current + 1);
    touchStartX = null;
  });
}
init();
</script>
</body>
</html>
